name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout Winter (octane branch)
        uses: actions/checkout@v5
        with:
          repository: austinderrick/winter
          ref: feat/octane-worker-support
          path: winter

      - name: Checkout Storm (octane branch)
        uses: actions/checkout@v5
        with:
          repository: austinderrick/storm
          ref: feat/octane-worker-support
          path: storm

      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: winter/plugins/winter/octane

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, xml, zip, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        working-directory: winter
        run: |
          composer install --no-interaction --no-progress
          composer require "laravel/octane:^2.5" --no-interaction --no-progress --with-all-dependencies

      # composer/installers places the module packages into modules/, which clobbers the branch's
      # own module changes checked out above. Reassert the branch content, then point the storm
      # package at the branch checkout the same way the development environment does (a symlink in
      # place of the packaged copy).
      - name: Use the branch modules and storm
        working-directory: winter
        run: |
          git checkout -- modules
          rm -rf vendor/winter/storm
          ln -s "$GITHUB_WORKSPACE/storm" vendor/winter/storm

      - name: Prepare application
        working-directory: winter
        run: |
          cp .env.example .env
          php artisan key:generate
          touch storage/database.sqlite
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=storage/database.sqlite|' .env
          php artisan winter:up

      - name: Lint
        working-directory: winter/plugins/winter/octane
        run: |
          ../../../vendor/bin/parallel-lint Plugin.php routes.php classes contracts tests
          ../../../vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Static analysis
        working-directory: winter/plugins/winter/octane
        run: |
          wget -q -O phpstan.phar https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar
          php phpstan.phar analyse -c phpstan.neon.dist --no-progress

      # --fail-on-skipped guards against a hollow pass: with laravel/octane absent, every worker
      # test skips and the suite still exits green. A skip in CI means the environment is broken.
      - name: Run plugin tests (in-process worker)
        working-directory: winter/plugins/winter/octane
        run: ../../../vendor/bin/phpunit --testsuite Octane --fail-on-skipped

      - name: Run end-to-end smoke test (real FrankenPHP server)
        working-directory: winter/plugins/winter/octane
        env:
          WINTER_OCTANE_E2E: '1'
        run: ../../../vendor/bin/phpunit --testsuite E2e --fail-on-skipped
